<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="wallWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e9"/>
      <stop offset="100%" stop-color="#dfd6c8"/>
    </linearGradient>
    <linearGradient id="innerDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ded4c5"/>
      <stop offset="100%" stop-color="#7e7060"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="900" height="1000" fill="url(#wallWhite)"/>

  <!-- Large Outer Arch -->
  <path d="M 50 1000 L 50 500 C 50 200, 220 50, 480 50 C 740 50, 850 220, 850 500 L 850 1000 Z" fill="#eee7dc"/>
  <path d="M 90 1000 L 90 520 C 90 260, 240 120, 480 120 C 720 120, 810 260, 810 520 L 810 1000 Z" fill="url(#innerDepth)"/>

  <!-- Inner Corridor Archway -->
  <path d="M 230 1000 L 230 580 C 230 420, 320 320, 480 320 C 640 320, 710 420, 710 580 L 710 1000 Z" fill="#ede5d8"/>
  <path d="M 260 1000 L 260 600 C 260 460, 340 380, 480 380 C 620 380, 680 460, 680 600 L 680 1000 Z" fill="#29332d"/>

  <!-- Green Garden framed at back end of arch -->
  <rect x="330" y="480" width="300" height="400" fill="#38493d"/>
  <path d="M 330 650 Q 480 610 630 660 L 630 880 L 330 880 Z" fill="#202e23"/>

  <!-- Polished light stone floor -->
  <polygon points="0,750 900,750 900,1000 0,1000" fill="#f0eae0" opacity="0.95"/>

  <!-- Round Daybed on Left side -->
  <ellipse cx="280" cy="740" rx="110" ry="45" fill="#f8f4ec" stroke="#ded5c6" stroke-width="2"/>
  <rect x="170" y="740" width="220" height="40" fill="#eae1d2" rx="4"/>

  <!-- Wood Table / vanity right -->
  <rect x="680" y="770" width="160" height="180" fill="#4a3b2f" rx="4"/>

  <!-- Label Badge -->
  <g transform="translate(450, 920)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="rgba(35, 32, 29, 0.85)" stroke="#bfa780" stroke-width="1.2"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e8dac5" text-anchor="middle" letter-spacing="2">
      AMENITIES PHOTO (900x1000)
    </text>
  </g>
</svg>
