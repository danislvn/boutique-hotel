<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="deluxeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#191411"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfb085"/>
      <stop offset="50%" stop-color="#9a7c56"/>
      <stop offset="100%" stop-color="#e2c89f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#deluxeBg)"/>
  
  <!-- Sculpted Curved Headboard feature inspired by screenshot -->
  <path d="M120 400 C 120 180, 240 100, 420 100 C 580 100, 680 200, 680 400 Z" fill="#201a14" stroke="#c0a379" stroke-width="3"/>
  <path d="M160 400 C 160 220, 260 140, 420 140 C 560 140, 640 230, 640 400 Z" fill="none" stroke="#a3855a" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M200 400 C 200 260, 280 180, 420 180 C 540 180, 600 260, 600 400 Z" fill="none" stroke="#7e6542" stroke-width="1"/>

  <!-- Crisp White Bed & Linens -->
  <path d="M140 420 L 700 420 L 760 550 L 80 550 Z" fill="#f8f5f0"/>
  <!-- Pillows -->
  <rect x="250" y="340" width="130" height="70" rx="8" fill="#ebe4d8" stroke="#d5cbbe" stroke-width="1"/>
  <rect x="420" y="340" width="130" height="70" rx="8" fill="#ebe4d8" stroke="#d5cbbe" stroke-width="1"/>

  <!-- Warm Hanging Pendant Light -->
  <line x1="280" y1="0" x2="280" y2="240" stroke="#bfa780" stroke-width="1.5"/>
  <circle cx="280" cy="250" r="14" fill="#ffdfaa" opacity="0.85"/>
  <circle cx="280" cy="250" r="38" fill="#ffdfaa" opacity="0.2"/>

  <!-- Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="rgba(24, 20, 16, 0.75)" stroke="#bfa780" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e8dac5" text-anchor="middle" letter-spacing="2">
      DELUXE ROOM (800x550)
    </text>
  </g>
</svg>
