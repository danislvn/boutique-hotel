<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="poolSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dad5cc"/>
      <stop offset="50%" stop-color="#cfc7ba"/>
      <stop offset="100%" stop-color="#b8b0a2"/>
    </linearGradient>
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc2c7"/>
      <stop offset="100%" stop-color="#469199"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#poolSky)"/>

  <!-- Tropical Palm Fronds and Greenery -->
  <path d="M 120 220 Q 240 60 400 140 Q 280 20 180 180 Z" fill="#3f4e39"/>
  <path d="M 280 280 Q 420 100 550 190 Q 400 60 300 240 Z" fill="#32402d"/>
  <path d="M 50 320 Q 180 180 320 250 Q 200 130 80 280 Z" fill="#4d5f46"/>

  <!-- Sun Umbrella -->
  <path d="M 200 360 C 200 280, 420 280, 420 360 Z" fill="#e2dacd"/>
  <line x1="310" y1="360" x2="310" y2="480" stroke="#685542" stroke-width="4"/>

  <!-- Pool Deck Terracotta / stone -->
  <polygon points="0,450 600,450 600,700 0,700" fill="#a48d78"/>

  <!-- Sun Loungers -->
  <polygon points="120,490 260,490 270,520 110,520" fill="#ded7ca"/>
  <polygon points="340,490 480,490 490,520 330,520" fill="#ded7ca"/>

  <!-- Swimming Pool Water -->
  <path d="M 0 540 Q 300 510 600 540 L 600 700 L 0 700 Z" fill="url(#poolWater)"/>
  <path d="M 0 555 Q 300 535 600 555" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none"/>

  <!-- Label Badge -->
  <g transform="translate(300, 640)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="rgba(24, 20, 16, 0.85)" stroke="#bfa780" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e8dac5" text-anchor="middle" letter-spacing="2">
      GARDEN POOL (600x700)
    </text>
  </g>
</svg>
