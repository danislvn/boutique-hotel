<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="execBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#322a22"/>
      <stop offset="100%" stop-color="#18130f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#execBg)"/>

  <!-- Terrace Window / Soft Lighting -->
  <rect x="220" y="80" width="360" height="320" rx="4" fill="#695c4d" opacity="0.35"/>
  <rect x="235" y="95" width="330" height="290" fill="#a4937e" opacity="0.4"/>

  <!-- Warm ambient lounge / daybed -->
  <path d="M180 380 L 620 380 L 660 550 L 140 550 Z" fill="#44372c"/>
  <ellipse cx="400" cy="450" rx="190" ry="70" fill="#ccbda8" opacity="0.65"/>
  <!-- Fur/Texture throw cushion -->
  <circle cx="380" cy="440" r="60" fill="#ded4c3" opacity="0.8"/>

  <!-- Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(24, 20, 16, 0.75)" stroke="#bfa780" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e8dac5" text-anchor="middle" letter-spacing="2">
      EXECUTIVE ROOM (800x550)
    </text>
  </g>
</svg>
